name: Backend CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: groundup
          POSTGRES_PASSWORD: groundup_password
          POSTGRES_DB: groundup_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Ruff Linter
        run: |
          ruff check backend

      - name: Run Mypy Typecheck
        run: |
          mypy --config-file backend/pyproject.toml backend/app

      - name: Run Pytest
        env:
          DATABASE_URL: postgresql+psycopg2://groundup:groundup_password@localhost:5432/groundup_test_db
          ASYNC_DATABASE_URL: postgresql+asyncpg://groundup:groundup_password@localhost:5432/groundup_test_db
          ENV: test
        run: |
          cd backend
          pytest tests -v
